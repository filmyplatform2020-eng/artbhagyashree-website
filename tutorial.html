<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial — Art Bhagyashree Studio</title>
  <meta name="description" content="Rangoli masterclass details by Bhagyashree Deshpande.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="tutorial-page"></main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      var t = TUTORIALS.find(function (x) { return x.id === id; });
      var page = document.getElementById("tutorial-page");
      if (!t) {
        page.innerHTML = '<section class="tutorial-page-section"><div class="container"><div class="empty-state"><h2>Course not found</h2><p>That tutorial does not exist.</p><a class="card-button" href="tutorials.html" style="margin-top:16px;justify-content:center">Back to Tutorials</a></div></div></section>';
        return;
      }

      var owned = (ABS.purchasedTutorials() || []).indexOf(t.id) !== -1;
      var soon = t.status === "coming-soon";

      var badge = soon
        ? '<span class="badge amber">Coming Soon</span>'
        : (owned ? '<span class="badge green">Owned</span>' : '<span class="badge maroon">Paid</span>');

      var lessons = t.whatYouLearn.map(function (l, i) {
        return '<div class="lesson-item"><div class="lesson-num">' + (i + 1) + '</div><span>' + l + '</span></div>';
      }).join("");

      var cta;
      if (soon) {
        cta = '<div style="display:flex;flex-direction:column;grid-row-gap:var(--sp-regular);align-items:flex-start">' +
          '<p style="color:var(--neutral-03);font-size:14px">This masterclass is still in production. Be the first to know when it launches.</p>' +
          ABS.arrowBtn("Notify Me on Launch", "#notify") +
          '</div>';
      } else if (owned) {
        cta = '<a class="primary-button" href="my-learning.html"><span class="button-bg-color-shape"></span><span class="primary-button-text">Go to My Learning</span><span class="primary-button-icon"><span class="button-icon-wrapper">' + ABS.icons.arrow + '</span></span></a>';
      } else {
        cta = '<div style="display:flex;flex-direction:column;grid-row-gap:var(--sp-regular);align-items:flex-start">' +
          '<div style="display:flex;align-items:center;grid-column-gap:var(--sp-regular)"><span style="font-family:var(--font-heading);font-size:30px;color:var(--theme-color-01)">' + t.priceLabel + '</span><span class="badge neutral">' + t.duration + '</span></div>' +
          ABS.arrowBtn("Buy This Course", "#buy") +
          '</div>';
      }

      page.innerHTML =
        '<section class="tutorial-page-section">' +
          '<div class="container tutorial-hero">' +
            '<div class="tutorial-hero-media"><img src="' + t.cover + '" alt="' + t.title + '"></div>' +
            '<div class="tutorial-hero-body">' +
              '<div class="tutorial-badge-row">' + badge + '<span class="badge neutral">' + t.level + '</span></div>' +
              '<h1 class="exhibitions-card-title" style="font-size:38px;letter-spacing:-1px">' + t.title + '</h1>' +
              '<p style="color:var(--neutral-03)">' + t.blurb + '</p>' +
              '<div style="display:flex;grid-column-gap:var(--sp-extra-large);margin:var(--sp-regular) 0">' +
                '<div><div class="counter-title" style="color:var(--neutral-04)">' + t.lessons + '</div><div class="counter-pg" style="color:var(--neutral-03)">Lessons</div></div>' +
                '<div><div class="counter-title" style="color:var(--neutral-04)">' + t.duration + '</div><div class="counter-pg" style="color:var(--neutral-03)">Duration</div></div>' +
                '<div><div class="counter-title" style="color:var(--neutral-04)">' + t.category + '</div><div class="counter-pg" style="color:var(--neutral-03)">Category</div></div>' +
              '</div>' +
              cta +
            '</div>' +
          '</div>' +
        '</section>' +
        '<section class="commerce-section">' +
          '<div class="container">' +
            '<div class="commerce-card">' +
              '<div class="tag-title" style="grid-row-gap:var(--sp-regular)"><span class="tag-line"></span><span class="tag-text">What you will learn</span></div>' +
              '<h2 class="section-heading" style="font-size:32px;margin-bottom:var(--sp-regular)">Course Lessons</h2>' +
              '<div class="lesson-list">' + lessons + '</div>' +
            '</div>' +
          '</div>' +
        '</section>';

      var notify = page.querySelector('#notify, #buy');
      if (notify) notify.addEventListener("click", function (e) {
        e.preventDefault();
        if (soon) ABS.toast("You're on the list — we'll email you at launch.");
        else {
          ABS.addToCart({ id: t.id, name: t.title, tagline: t.category + " masterclass", price: t.price, img: t.cover }, 1);
          setTimeout(function () { location.href = "cart.html"; }, 900);
        }
      });
    })();
  </script>
</body>
</html>
