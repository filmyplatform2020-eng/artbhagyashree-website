<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Art Bhagyashree Studio</title>
  <meta name="description" content="Checkout — secure demo checkout for Lake Colours and rangoli masterclasses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="inner-hero-section">
      <div class="container inner-hero-content-wrapper">
        <div class="tag-title">
          <span class="tag-line"></span>
          <span class="tag-text">Checkout</span>
        </div>
        <h1 class="inner-hero-title">Checkout</h1>
      </div>
    </section>

    <section class="commerce-section">
      <div class="container commerce-grid" id="checkout-body"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (function () {
      var body = document.getElementById("checkout-body");
      function render() {
        var cart = ABS.cart.get();
        if (!cart.length) {
          location.href = "cart.html";
          return;
        }
        var lines = cart.map(function (i) {
          return '<div class="order-item"><span>' + i.name + ' × ' + i.qty + '</span><span>' + ABS.fmt(i.price * i.qty) + '</span></div>';
        }).join("");
        body.innerHTML =
          '<form class="commerce-card" id="checkout-form">' +
            '<h3 class="exhibitions-card-title" style="font-size:28px">Contact &amp; Delivery</h3>' +
            '<div class="form-grid" style="margin-top:16px">' +
              '<div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="d-name" placeholder="Your name" required></div>' +
              '<div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="d-phone" placeholder="+91 …" required></div>' +
              '<div class="form-group full"><label class="form-label">Email</label><input class="form-input" id="d-email" type="email" placeholder="you@email.com" required></div>' +
              '<div class="form-group full"><label class="form-label">Address</label><input class="form-input" id="d-addr" placeholder="Street, city, PIN" required></div>' +
            '</div>' +
            '<div style="margin-top:24px">' + ABS.arrowBtn("Continue to Payment", "#", "go-pay") + '</div>' +
          '</form>' +
          '<aside class="commerce-card">' +
            '<h3 class="exhibitions-card-title" style="font-size:28px">Order Summary</h3>' + lines +
            '<div class="order-summary-row total"><span>Total</span><span>' + ABS.fmt(ABS.cart.total()) + '</span></div>' +
            '<p style="font-size:13px;color:var(--neutral-03);margin-top:12px">Demo store — payments are simulated. No real charge occurs.</p>' +
          '</aside>';

        var form = document.getElementById("checkout-form");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var vals = ["d-name", "d-phone", "d-email", "d-addr"].map(function (id) { return document.getElementById(id).value.trim(); });
          if (vals.some(function (v) { return !v; })) { ABS.toast("Please complete all fields."); return; }
          localStorage.setItem("abs_delivery", JSON.stringify({ name: vals[0], phone: vals[1], email: vals[2], addr: vals[3] }));
          location.href = "payment.html";
        });
        var goPay = form.querySelector(".go-pay");
        if (goPay) goPay.addEventListener("click", function (e) {
          e.preventDefault();
          if (form.reportValidity()) form.requestSubmit();
          else ABS.toast("Please complete all fields.");
        });
      }
      render();
    })();
  </script>
</body>
</html>
