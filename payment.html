<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — Art Bhagyashree Studio</title>
  <meta name="description" content="Demo payment — sandbox simulated, no real charge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="inner-hero-section">
      <div class="container inner-hero-content-wrapper">
        <div class="tag-title">
          <span class="tag-line"></span>
          <span class="tag-text">Payment</span>
        </div>
        <h1 class="inner-hero-title">Payment</h1>
        <p class="inner-hero-pg" style="color:var(--theme-color-01);font-weight:500">Demo store — sandbox simulation, no real money moves.</p>
      </div>
    </section>

    <section class="commerce-section">
      <div class="container commerce-grid" id="pay-body"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (function () {
      var body = document.getElementById("pay-body");
      var cart = ABS.cart.get();
      if (!cart.length) { location.href = "cart.html"; return; }

      var lines = cart.map(function (i) {
        return '<div class="order-item"><span>' + i.name + ' × ' + i.qty + '</span><span>' + ABS.fmt(i.price * i.qty) + '</span></div>';
      }).join("");

      body.innerHTML =
        '<div class="commerce-card">' +
          '<h3 class="exhibitions-card-title" style="font-size:28px">Pay ' + ABS.fmt(ABS.cart.total()) + '</h3>' +
          '<div style="margin-top:16px">' + lines + '</div>' +
          '<div style="margin-top:16px;padding:12px 14px;background:var(--neutral-02);border:1px dashed var(--border-card);border-radius:var(--radius-medium);font-size:13px;color:var(--neutral-03)">This demo simulates a payment. In production this step connects to Razorpay / Cashfree / your backend for real signature-verified payment.</div>' +
          '<div id="pay-button" style="margin-top:24px"></div>' +
        '</div>' +
        '<aside class="commerce-card">' +
          '<h3 class="exhibitions-card-title" style="font-size:28px">Summary</h3>' +
          '<div class="order-summary-row total"><span>Total</span><span>' + ABS.fmt(ABS.cart.total()) + '</span></div>' +
        '</aside>';

      document.getElementById("pay-button").innerHTML = ABS.arrowBtn("Pay " + ABS.fmt(ABS.cart.total()), "#");
      document.getElementById("pay-button").querySelector(".primary-button").addEventListener("click", function (e) {
        e.preventDefault();
        var btn = this;
        btn.classList.add("disabled");
        btn.style.opacity = 0.6; btn.style.pointerEvents = "none";
        var delivery = JSON.parse(localStorage.getItem("abs_delivery") || "{}");
        var order = {
          order_id: "ORD-" + Date.now(),
          date: new Date().toISOString(),
          customer: { name: delivery.name || "", email: delivery.email || "", phone: delivery.phone || "", addr: delivery.addr || "" },
          items: cart.map(function (i) { return { id: i.id, name: i.name, price: i.price, qty: i.qty }; }),
          total: ABS.cart.total()
        };
        ABS.initPay(order).then(function (result) {
          order.payment = result;
          ABS.addOrder(order);
          ABS.cart.set([]);
          location.href = "confirmation.html?order=" + order.order_id;
        });
      });
    })();
  </script>
</body>
</html>
