<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नवरंग कलावर्ग — Learn Rangoli | Art Bhagyashree Studio</title>
  <meta name="description" content="नवरंग कलावर्ग — an art-learning initiative by Art Bhagyashree Studio. Portrait, realistic and design Rangoli, drawing, painting and special workshops.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="inner-hero-section">
      <div class="container inner-hero-content-wrapper">
        <div class="tag-title">
          <span class="tag-line"></span>
          <span class="tag-text">नवरंग कलावर्ग — Learn • Create • Explore</span>
        </div>
        <h1 class="inner-hero-title">नवरंग कलावर्ग</h1>
        <p class="inner-hero-pg" id="navrang-intro"></p>
      </div>
    </section>

    <section class="upcoming-event-section" style="padding-top:0">
      <div class="container">
        <div class="events-content-wrapper">
          <div class="events-heading-wrap">
            <h2 class="section-heading">What You Can Learn</h2>
          </div>
          <div class="navrang-courses" id="navrang-courses"></div>
          <div class="navrang-cta" style="margin-top:var(--sp-xxl)">
            <a class="primary-button" href="tutorials.html">
              <span class="button-bg-color-shape" aria-hidden="true"></span>
              <span class="primary-button-text">View Upcoming Batches</span>
              <span class="primary-button-icon"><span class="button-icon-wrapper" id="batch-arrow"></span></span>
            </a>
          </div>
          <div class="intl-gallery" id="workshop-gallery" style="margin-top:var(--sp-xxl)"></div>
        </div>
      </div>
    </section>

    <section class="testimonials-section">
      <div class="container">
        <div class="testimonials-content-wrapper">
          <div class="sections-title">
            <div class="tag-title">
              <span class="tag-line"></span>
              <span class="tag-text">Our Track Record</span>
            </div>
            <h2 class="section-heading">A Growing Community of Artists</h2>
          </div>
          <div class="achievements-list" id="navrang-facts"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    document.getElementById("navrang-intro").textContent = NAVRANG.intro;
    document.getElementById("navrang-courses").innerHTML = NAVRANG.courses.map(function (c) {
      return '<span class="navrang-course">' + c + '</span>';
    }).join("");
    document.getElementById("batch-arrow").innerHTML = ABS.icons.arrow;
    document.getElementById("workshop-gallery").innerHTML = WORKSHOP_GALLERY.map(function (src) {
      return '<div class="intl-gallery-item reveal"><img src="' + src + '" alt="Rangoli workshop and process" loading="lazy"></div>';
    }).join("");
    document.getElementById("navrang-facts").innerHTML = NAVRANG.facts.map(function (f) {
      return '<div class="achievement-item reveal">' +
        '<span class="achievement-marker">' + ABS.icons.check + '</span>' +
        '<div class="achievement-title">' + f + '</div>' +
      '</div>';
    }).join("");
    ABS.initReveal();
  </script>
</body>
</html>
