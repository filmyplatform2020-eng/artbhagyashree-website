<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Art Bhagyashree Studio</title>
  <meta name="description" content="Your account — orders, learning and profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="inner-hero-section">
      <div class="container inner-hero-content-wrapper">
        <div class="tag-title">
          <span class="tag-line"></span>
          <span class="tag-text">Account</span>
        </div>
        <h1 class="inner-hero-title">My Account</h1>
      </div>
    </section>

    <section class="account-section">
      <div class="container" id="account-body"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (function () {
      var body = document.getElementById("account-body");
      function render() {
        var user = ABS.getUser();
        var orders = ABS.getOrders();

        if (!user) {
          body.innerHTML =
            '<div class="account-card" style="margin:0 auto">' +
              '<div class="tag-title" style="grid-row-gap:var(--sp-regular)"><span class="tag-line"></span><span class="tag-text">Sign In</span></div>' +
              '<h2 class="exhibitions-card-title" style="font-size:30px;margin-top:12px">Welcome back</h2>' +
              '<form id="login-form" style="margin-top:16px">' +
                '<div class="form-group"><label class="form-label">Name</label><input class="form-input" id="l-name" placeholder="Your name"></div>' +
                '<div class="form-group" style="margin-top:12px"><label class="form-label">Email</label><input class="form-input" id="l-email" type="email" placeholder="you@email.com"></div>' +
                '<div style="margin-top:20px">' + ABS.arrowBtn("Sign In", "#") + '</div>' +
              '</form>' +
              '<p style="font-size:13px;color:var(--neutral-03);margin-top:16px">Demo account — no password, stored only in this browser.</p>' +
            '</div>';
          document.getElementById("login-form").addEventListener("submit", function (e) {
            e.preventDefault();
            var name = document.getElementById("l-name").value.trim();
            var email = document.getElementById("l-email").value.trim();
            if (!name || !email) { ABS.toast("Enter your name and email."); return; }
            ABS.setUser({ name: name, email: email });
            ABS.toast("Signed in as " + name);
            render();
          });
          var loginForm = document.getElementById("login-form");
          var loginBtn = loginForm.querySelector(".primary-button");
          if (loginBtn) loginBtn.addEventListener("click", function (e) {
            e.preventDefault();
            if (loginForm.reportValidity()) loginForm.requestSubmit();
            else ABS.toast("Enter your name and email.");
          });
          return;
        }

        var orderHtml = orders.length ? orders.map(function (o) {
          var items = o.items.map(function (i) { return i.name + " × " + i.qty; }).join(", ");
          return '<div class="order-item"><span><span class="order-id">' + o.order_id + '</span><br><span style="color:var(--neutral-03);font-size:13px">' + items + '</span></span><span>' + ABS.fmt(o.total) + '</span></div>';
        }).join("") : '<p style="color:var(--neutral-03)">No orders yet.</p>';

        body.innerHTML =
          '<div class="commerce-grid">' +
            '<div class="commerce-card">' +
              '<div class="showcase-card-bottom-content" style="align-items:flex-start">' +
                '<div>' +
                  '<h2 class="exhibitions-card-title" style="font-size:30px">' + user.name + '</h2>' +
                  '<p style="color:var(--neutral-03);margin-top:4px">' + user.email + '</p>' +
                '</div>' +
                '<button class="card-button" id="logout">Sign Out</button>' +
              '</div>' +
            '</div>' +
            '<div class="commerce-card">' +
              '<h3 class="exhibitions-card-title" style="font-size:28px">Orders</h3>' +
              '<div style="margin-top:12px">' + orderHtml + '</div>' +
            '</div>' +
          '</div>';
        document.getElementById("logout").addEventListener("click", function () {
          ABS.setUser(null);
          ABS.toast("Signed out");
          render();
        });
      }
      render();
    })();
  </script>
</body>
</html>
