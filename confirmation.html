<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation — Art Bhagyashree Studio</title>
  <meta name="description" content="Thank you — your order is confirmed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="commerce-section" style="padding-top:var(--pad-section-xl)">
      <div class="container">
        <div class="commerce-card">
          <div class="confirmation-wrap">
            <div class="check-badge">check_icon</div>
            <div class="tag-title" style="grid-row-gap:var(--sp-regular)">
              <span class="tag-line"></span>
              <span class="tag-text">Order Confirmed</span>
            </div>
            <h1 class="exhibitions-card-title" style="font-size:38px;letter-spacing:-1px">Thank You!</h1>
            <p style="color:var(--neutral-03)">Your order has been received. A confirmation email will follow.</p>
            <div id="order-box" style="width:100%;margin-top:8px"></div>
            <div style="display:flex;grid-column-gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px">
              <a class="primary-button" href="my-learning.html" style="justify-content:center"><span class="button-bg-color-shape"></span><span class="primary-button-text">Go to My Learning</span></a>
              <a class="card-button" href="portfolio.html" style="justify-content:center">Continue Browsing</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/gsap/3.15.0/gsap.min.js"></script>
  <script src="assets/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (function () {
      document.querySelector(".check-badge").innerHTML = ABS.icons.check;
      var orderId = new URLSearchParams(location.search).get("order");
      var order = ABS.getOrders().find(function (o) { return o.order_id === orderId; });
      var box = document.getElementById("order-box");
      if (order) {
        box.innerHTML =
          '<div style="padding:16px;background:var(--neutral-02);border-radius:var(--radius-medium);border:1px solid var(--border-card);text-align:left">' +
            '<div class="order-summary-row"><span>Order ID</span><span class="order-id">' + order.order_id + '</span></div>' +
            (order.payment ? '<div class="order-summary-row"><span>Transaction</span><span>' + order.payment.transaction_id + '</span></div>' : "") +
            (order.payment ? '<div class="order-summary-row"><span>Mode</span><span>Sandbox (no real charge)</span></div>' : "") +
            '<div class="order-summary-row total"><span>Total</span><span>' + ABS.fmt(order.total) + '</span></div>' +
          '</div>';
      } else {
        box.innerHTML = '<p style="color:var(--neutral-03)">No order found on this device.</p>';
      }
    })();
  </script>
</body>
</html>
